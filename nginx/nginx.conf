# Proxy inverso de TaLibre. Cloudflare termina el TLS publico (modo Full strict) y nginx lo vuelve a terminar con el
# certificado de origen; el nombre de dominio no figura en este archivo: se atienden todos los Host (server_name _).
# Los registros de acceso omiten la query string (el WebSocket lleva el token ahi) y los de error solo guardan fallas
# criticas, porque nginx imprime en ellos la linea completa de la peticion.

limit_conn_zone $binary_remote_addr zone=ws_por_ip:10m;

log_format registro_sin_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                              '$status $body_bytes_sent "$http_user_agent" rt=$request_time';
log_format registro_ws '$remote_addr [$time_local] "WS $uri" $status $body_bytes_sent rt=$request_time';

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    access_log /dev/stdout registro_sin_query;
    error_log /dev/stderr crit;

    if ($origen_permitido = 0) {
        return 444;
    }

    location = /nginx-salud {
        allow 127.0.0.1;
        deny all;
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /dev/stdout registro_sin_query;
    error_log /dev/stderr crit;

    if ($origen_permitido = 0) {
        return 444;
    }

    client_max_body_size 1m;

    include /etc/nginx/snippets/cabeceras-seguridad.inc;

    # Docker reasigna la IP de un contenedor al recrearlo: se vuelve a resolver el nombre en cada uso, no al arrancar.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_django http://web:8000;
    set $upstream_node http://node:3000;

    root /usr/share/nginx/html;

    location ~ /\. {
        return 404;
    }

    # Solo backend-django las consume, por la red interna: hacia internet no existen.
    location ^~ /api/interno {
        return 404;
    }

    location ~ ^/api/(actividad|reportes-aux|externa)(/|$) {
        include /etc/nginx/snippets/proxy.inc;
        proxy_pass $upstream_node;
    }

    location /api/ {
        include /etc/nginx/snippets/proxy.inc;
        proxy_pass $upstream_django;
    }

    location ^~ /graphql {
        include /etc/nginx/snippets/proxy.inc;
        proxy_pass $upstream_django;
    }

    location ^~ /static/ {
        include /etc/nginx/snippets/proxy.inc;
        proxy_pass $upstream_django;
    }

    location /ws/ {
        limit_conn ws_por_ip 20;
        limit_conn_status 429;
        access_log /dev/stdout registro_ws;

        include /etc/nginx/snippets/proxy.inc;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_pass $upstream_django;
    }

    location = /index.html {
        include /etc/nginx/snippets/cabeceras-seguridad.inc;
        include /etc/nginx/snippets/sin-cache.inc;
    }

    location = /sw.js {
        include /etc/nginx/snippets/cabeceras-seguridad.inc;
        include /etc/nginx/snippets/sin-cache.inc;
    }

    location = /manifest.json {
        include /etc/nginx/snippets/cabeceras-seguridad.inc;
        include /etc/nginx/snippets/sin-cache.inc;
    }

    # Los archivos de Vite llevan el hash del contenido en el nombre: nunca cambian bajo la misma direccion.
    location /assets/ {
        include /etc/nginx/snippets/cabeceras-seguridad.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        gzip_min_length 1024;
        gzip_vary on;
        try_files $uri =404;
    }

    location ~ ^/(icons|fonts)/ {
        include /etc/nginx/snippets/cabeceras-seguridad.inc;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Rutas de React Router: cualquier direccion que no sea un archivo devuelve la aplicacion.
    location / {
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml text/plain;
        gzip_min_length 1024;
        gzip_vary on;
        try_files $uri /index.html;
    }
}
