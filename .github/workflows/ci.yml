name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  django:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-django
    env:
      DJANGO_SECRET_KEY: ci-0123456789abcdef0123456789abcdef
      JWT_SIGNING_KEY: ci-fedcba9876543210fedcba9876543210
      DJANGO_DEBUG: "False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend-django/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar migraciones
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test

      - name: Ejecutar tests con cobertura
        run: pytest --cov=core
