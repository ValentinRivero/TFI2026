name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  django:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-django
    env:
      DJANGO_SECRET_KEY: ci-0123456789abcdef0123456789abcdef
      JWT_SIGNING_KEY: ci-fedcba9876543210fedcba9876543210
      DJANGO_DEBUG: "False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend-django/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar migraciones
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test

      - name: Ejecutar tests con cobertura
        run: pytest --cov=core

  # select_for_update no bloquea en SQLite: la concurrencia del motor de reservas se prueba sobre PostgreSQL,
  # en un contenedor descartable, sin frenar la suite general.
  django-concurrencia:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-django
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talibre
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-0123456789abcdef0123456789abcdef
      JWT_SIGNING_KEY: ci-fedcba9876543210fedcba9876543210
      DJANGO_DEBUG: "False"
      TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/talibre?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend-django/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas de concurrencia sobre PostgreSQL
        run: pytest core/tests/test_concurrencia.py --ds=config.settings_concurrencia -v -rs

    
  # La suite de Node simula Django, Open-Meteo y MongoDB: no necesita servicios ni secretos, cada test fija su
  # propia configuración y corre en orden aleatorio para detectar dependencias entre tests.
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend-node/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Verificar sintaxis del punto de entrada
        run: node --check server.js

      - name: Ejecutar tests con cobertura
        run: npm run test:cobertura
